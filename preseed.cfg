# ============================================================
# Debian 13 (Trixie) 自动化安装 Preseed 配置
# ============================================================

### 本地化与键盘
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### 网络配置（强制 IPv4，自动 DHCP）
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string local

### 安装期间的镜像源：强制 HTTP 协议的阿里云
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string mirrors.aliyun.com
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 时区：中国上海
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai

### 分区：全盘自动分区（atomic 配方）
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic

### 核心改动：Root 默认无密码，并允许设置弱/空密码
d-i passwd/root-login boolean true
d-i user-setup/allow-password-weak boolean true

# 设置一个临时虚拟密码，避免安装器卡住
d-i passwd/root-password password dummy
d-i passwd/root-password-again password dummy

### 不自动建用户（推迟到首次开机交互）
d-i passwd/make-user boolean false

### 核心极简优化：关闭一切不需要的下载
d-i apt-setup/services-select multiselect none
d-i pkgsel/include string openssh-server eject ca-certificates
d-i pkgsel/install-recommends boolean false
d-i pkgsel/upgrade select none
d-i pkgsel/updatedb boolean false

# 跳过 standard 任务集
tasksel tasksel/first multiselect
tasksel tasksel/skip-tasks string standard

### 引导程序安装
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### 收尾
d-i finish-install/reboot_in_progress note

### Late Command
d-i preseed/late_command string \
    cp /cdrom/aliyun-debian.sources /target/etc/apt/sources.list.d/debian.sources; \
    rm -f /target/etc/apt/sources.list; \
    cp /cdrom/setup-root.sh /target/tmp/setup-root.sh; \
    chmod +x /target/tmp/setup-root.sh; \
    in-target /tmp/setup-root.sh; \
    rm -f /target/tmp/setup-root.sh; \
    cp /cdrom/firstboot.sh /target/usr/local/bin/firstboot.sh; \
    cp /cdrom/ask-user.sh /target/usr/local/bin/ask-user.sh; \
    chmod +x /target/usr/local/bin/firstboot.sh /target/usr/local/bin/ask-user.sh; \
    cp /cdrom/firstboot.service /target/etc/systemd/system/firstboot.service; \
    in-target systemctl enable firstboot.service; \
    cp /cdrom/cleanup-target.sh /target/tmp/cleanup-target.sh; \
    chmod +x /target/tmp/cleanup-target.sh; \
    in-target /tmp/cleanup-target.sh || true; \
    rm -f /target/tmp/cleanup-target.sh